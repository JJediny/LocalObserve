author: LocalObserve Team
date: 2026-09-27
description: Detects an AI agent tool call making outbound network requests to
  non-workspace hosts - a potential data-exfiltration or C2 channel indicator
  when triggered by untrusted content (prompt injection).
detection:
  condition: selection and not filter
  selection:
    Image|contains:
    - fetch
    - http
    - curl
    - wget
    - web_request
    - browser
    - download
  filter:
    CommandLine|contains:
    - localhost
    - 127.0.0.1
    - github.com
    - pypi.org
    - crates.io
    - npmjs.org
    - registry.npmjs.org
    - openobserve
    - localhost:5080
falsepositives:
- Agent fetching public documentation for the current task
- Package managers resolving dependencies
fields:
- Image
- CommandLine
- ai_session_id
id: 5a1e0000-0000-4a91-a1a1-000000000005
level: medium
logsource:
  product: ai_agent
  service: otel
status: experimental
tags:
- attack.t1071
- attack.command_and_control
title: AI Agent Suspicious Network Egress
