author: LocalObserve Team
date: 2026-09-27
description: Detects an AI agent tool call reading credential stores -
  cloud CLI credentials, environment secret files, API key files or SSH keys.
detection:
  condition: selection
  selection:
    CommandLine|contains:
    - .aws/credentials
    - .aws/config
    - .gcp/
    - .azure/
    - .kube/config
    - .env
    - .npmrc
    - .netrc
    - id_rsa
    - .ssh/id_
    - service-account
    - .docker/config.json
falsepositives:
- Development workflows where the agent reads a local .env with explicit approval
  (tune by workspace root if this fires too often)
fields:
- Image
- CommandLine
- ai_session_id
id: 5a1e0000-0000-4a91-a1a1-000000000003
level: critical
logsource:
  product: ai_agent
  service: otel
status: experimental
tags:
- attack.t1552.001
- attack.t1552.004
- attack.credential_access
title: AI Agent Credential File Read
