# LocalObserve log rotation - binds to the files the OTel collector tails.
#
# Install (copies config + enables weekly timer):
#   sudo cp scripts/logrotate-localobserve.conf /etc/logrotate.d/localobserve
#
# copytruncate is required: the OTel filelog receiver keeps the file open, and
# copytruncate preserves the inode so tailing continues without a gap.
# Rotation is validated by tests/test_stack_rotation.py to cause no detection
# loss (see docs/benchmark_and_agent_observability_plan.md, risk register).

/home/john/LocalObserve/.data/osquery/osqueryd.results.log {
    weekly
    rotate 8
    maxsize 50M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}

/home/john/LocalObserve/.data/falco/events.jsonl {
    weekly
    rotate 8
    maxsize 50M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
