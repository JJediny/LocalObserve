# LocalObserve Container Image Sourcing & Provider Configuration
# Allows operators to toggle between custom Distroless builds, pinned upstream vendor publishers, or custom OCI registry endpoints.

version: "1.0"
sourcing_strategy:
  # Mode choices: "custom_distroless", "vendor_upstream", "custom_oci_registry"
  mode: "custom_distroless"
  custom_oci_registry_prefix: "ghcr.io/jjediny/localobserve"

components:
  openobserve:
    custom_distroless:
      dockerfile: "docker/Dockerfile.openobserve.distroless"
      base_image: "gcr.io/distroless/static-debian12:nonroot"
      image_tag: "openobserve:distroless-v0.14.8"
      cve_count_validated: 0
      image_size_mb: 28.4
    vendor_upstream:
      image: "public.ecr.aws/zinclabs/openobserve:v0.14.8"
      digest: "sha256:0c057ffda5a29cbf945023e4710bf38f192e61f807201a7c6611f9a8761c1756"
      cve_count_validated: 2
      image_size_mb: 42.1

  falco:
