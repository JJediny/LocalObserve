{
  "options": {
    "logger_path": "/var/log/osquery",
    "disable_logging": false,
    "schedule_splay_percent": 25,
    "worker_threads": 2,
    "utc": true
  },
  "schedule": {
    "// ===== SYSTEM INFORMATION (1x daily) ===== ": {},
    "system_info": {
      "query": "SELECT * FROM system_info;",
      "interval": 86400,
      "description": "System information - collected once daily"
    },
    "os_version": {
      "query": "SELECT * FROM os_version;",
      "interval": 86400,
      "description": "OS version - collected once daily"
    },

    "// ===== CRITICAL SECURITY (1x hourly) ===== ": {},
    "file_changes": {
      "query": "SELECT * FROM file WHERE path IN ('/etc/passwd', '/etc/shadow', '/etc/sudoers', '/etc/ssh/sshd_config', '/root/.ssh/authorized_keys', '/boot/grub/grub.cfg');",
      "interval": 3600,
      "description": "Critical file integrity - most important, hourly",
      "value": "Detect modifications to critical system files"
    },
    "listening_ports": {
      "query": "SELECT * FROM listening_ports;",
      "interval": 3600,
      "description": "Listening network ports - hourly check for backdoors",
      "value": "Identify rogue listening ports/backdoors"
    },

    "// ===== PERSISTENCE (2x daily) ===== ": {},
    "crontab": {
      "query": "SELECT * FROM crontab;",
      "interval": 43200,
      "description": "Scheduled cron jobs - 2x daily",
      "value": "Identify malware using cron for persistence"
    },
    "systemd_units": {
      "query": "SELECT * FROM systemd_units;",
      "interval": 43200,
      "description": "Systemd service units - 2x daily",
      "value": "Identify malware creating rogue systemd services"
    },
    "authorized_keys": {
      "query": "SELECT * FROM authorized_keys;",
      "interval": 43200,
      "description": "SSH authorized_keys files - 2x daily",
      "value": "Detect SSH backdoors and persistence mechanisms"
    },

    "// ===== PRIVILEGE ESCALATION (2x daily) ===== ": {},
    "suid_bin": {
      "query": "SELECT * FROM suid_bin;",
      "interval": 43200,
      "description": "SUID binaries - 2x daily",
      "value": "Detect dropped/modified SUID binaries for privesc"
    },
    "sudoers": {
      "query": "SELECT * FROM sudoers;",
      "interval": 43200,
      "description": "Sudoers configuration - 2x daily",
      "value": "Detect unauthorized sudo access grants"
    },

    "// ===== KERNEL SECURITY (2x daily) ===== ": {},
    "kernel_modules": {
      "query": "SELECT * FROM kernel_modules;",
      "interval": 43200,
      "description": "Loaded kernel modules - 2x daily",
      "value": "Identify kernel rootkits and LPE exploits"
    },

    "// ===== LINUX KEV EXPLOIT INDICATORS ===== ": {},
    "kev_namespace_tooling": {
      "query": "SELECT pid, parent, name, path, cmdline, uid, gid FROM processes WHERE (name = 'unshare' AND (cmdline LIKE '%--user%' OR cmdline LIKE '%--map-root-user%' OR cmdline LIKE '%--mount%')) OR name IN ('newuidmap', 'newgidmap', 'nsenter', 'fuse-overlayfs', 'setcap', 'capsh', 'modprobe', 'insmod', 'rmmod') LIMIT 100;",
      "interval": 3600,
      "description": "Namespace, overlayfs, and privilege-helper tooling - hourly",
      "value": "Detect user-namespace, overlayfs, and kernel-module exploit helpers"
    },
    "kev_sensitive_mounts": {
      "query": "SELECT * FROM mounts WHERE type IN ('overlay', 'fuse.overlayfs', 'debugfs', 'tracefs', 'securityfs', 'bpf') OR path IN ('/sys/kernel/debug', '/sys/fs/bpf') LIMIT 100;",
      "interval": 21600,
      "description": "Overlayfs and kernel-debug related mounts - every 6 hours",
      "value": "Detect suspicious overlayfs, debugfs, tracefs, or BPF mount usage"
    },
    "kev_sensitive_kernel_file_access": {
      "query": "SELECT DISTINCT pid, path FROM process_open_files WHERE path IN ('/etc/ld.so.preload', '/proc/sys/kernel/core_pattern', '/proc/sys/kernel/modprobe', '/proc/kallsyms', '/proc/kcore') OR path LIKE '/etc/modprobe.d/%' LIMIT 100;",
      "interval": 3600,
      "description": "Kernel and loader control file access - hourly",
      "value": "Detect access to core_pattern, modprobe, ld.so.preload, kallsyms, and related files"
    },

    "// ===== USERS & ACCOUNTS (2x daily) ===== ": {},
    "users": {
      "query": "SELECT * FROM users;",
      "interval": 43200,
      "description": "System users - 2x daily",
      "value": "Detect creation of backdoor accounts"
    },
    "logged_in_users": {
      "query": "SELECT * FROM logged_in_users LIMIT 50;",
      "interval": 3600,
      "description": "Currently logged in users - hourly",
      "value": "Detect unauthorized user sessions"
    },

    "// ===== NETWORK SECURITY (3x daily = 8h interval) ===== ": {},
    "iptables": {
      "query": "SELECT * FROM iptables;",
      "interval": 28800,
      "description": "iptables firewall rules - 3x daily",
      "value": "Detect firewall misconfigurations and backdoors"
    },
    "process_open_sockets": {
      "query": "SELECT DISTINCT pid, family, protocol, local_address, local_port, remote_address, remote_port FROM process_open_sockets WHERE remote_address NOT IN ('0.0.0.0', '::', '') LIMIT 100;",
      "interval": 28800,
      "description": "Open network connections - 3x daily, limited results",
      "value": "Detect malware C2 communications"
    },

    "// ===== PROCESSES (3x daily = 8h interval) ===== ": {},
    "processes": {
      "query": "SELECT pid, name, path, cmdline, parent, uid, gid, state FROM processes LIMIT 500;",
      "interval": 28800,
      "description": "Running processes snapshot - 3x daily, limited fields",
      "value": "Baseline for anomaly detection"
    },

    "// ===== FILESYSTEM (2x daily) ===== ": {},
    "etc_hosts": {
      "query": "SELECT * FROM etc_hosts;",
      "interval": 43200,
      "description": "/etc/hosts file - 2x daily",
      "value": "Identify DNS/host-level redirection attacks"
    },
    "mounts": {
      "query": "SELECT * FROM mounts;",
      "interval": 43200,
      "description": "Mounted filesystems - 2x daily",
      "value": "Detect unauthorized mounts and lateral movement"
    },

    "// ===== PACKAGES (1x daily) ===== ": {},
    "deb_packages": {
      "query": "SELECT COUNT(*) as count FROM deb_packages;",
      "interval": 86400,
      "description": "Installed Debian packages count - 1x daily",
      "value": "Detect installed malware packages"
    },

    "// ===== SECURITY FEATURES (1x daily) ===== ": {},
    "selinux_settings": {
      "query": "SELECT * FROM selinux_settings;",
      "interval": 86400,
      "description": "SELinux policy status - 1x daily",
      "value": "Verify mandatory access control is enforced"
    },
    "apparmor_profiles": {
      "query": "SELECT * FROM apparmor_profiles;",
      "interval": 86400,
      "description": "AppArmor profile status - 1x daily",
      "value": "Verify application sandboxing"
    },

    "// ===== DOCKER (1x daily) ===== ": {},
    "docker_containers": {
      "query": "SELECT * FROM docker_containers;",
      "interval": 86400,
      "description": "Running Docker containers - 1x daily",
      "value": "Detect container-based exploits"
    }
  },
  "decorators": {
    "load": [
      "SELECT uuid AS host_uuid FROM system;",
      "SELECT hostname FROM system_info;"
    ]
  },
  "packs": {}
}
