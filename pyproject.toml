[project]
name = "localobserve-tests"
version = "0.1.0"
description = "Pytest-based validation for Falco and osquery configuration in this repository."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "opentelemetry-api>=1.42.0",
  "opentelemetry-exporter-otlp-proto-http>=1.42.0",
  "opentelemetry-sdk>=1.42.0",
  "pytest>=8.3.5",
  "pyyaml>=6.0.2",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests that exercise the running OpenObserve/Falco stack",
  "host_emulation: tests that execute host-side emulation commands and emit OTEL traces",
]
