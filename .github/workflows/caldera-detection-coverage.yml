name: caldera-detection-coverage

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  coverage:
    name: Telemetry & Static Coverage Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Run static coverage-related tests
        run: uv run python -m pytest tests/test_detection_coverage.py tests/test_falco_rules.py tests/test_osquery_config.py tests/test_maturity_matrix.py tests/test_maturity_scripts.py -q

      - name: Summarize live coverage artifact status
        if: always()
        run: |
          if [ -f .data/coverage/caldera_detection_coverage.json ]; then
            python3 -c "import json, pathlib; r = json.loads(pathlib.Path('.data/coverage/caldera_detection_coverage.json').read_text()); print(f'coverage_percent={r[\"coverage_percent\"]}'); print(f'total_verified_signals={r[\"total_verified_signals\"]}'); print(f'total_expected_signals={r[\"total_expected_signals\"]}')"
          else
            echo 'Live CALDERA coverage artifact not generated in this workflow.'
            echo 'Run task test-caldera-detection-coverage on a stack-enabled runner to publish trend data.'
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caldera-detection-coverage
          path: .data/coverage/caldera_detection_coverage.json
          if-no-files-found: ignore

  build-and-test:
    name: Package Build, UV Upgrade & Compliance Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Emulate Package Build
        run: uv build

      - name: Upgrade Dependencies (uv lock)
        run: uv lock --upgrade

      - name: Run Compliance Validation Suite
        run: uv run pytest tests/test_compliance_validation.py -v

      - name: Commit & Push uv.lock Changes
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-upgrade lockfile dependencies via uv [skip ci]" && git push)
