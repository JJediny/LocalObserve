name: Container Image Scan

on:
  pull_request:
    paths:
      - 'docker-compose.yaml'
      - 'scripts/scan-images.sh'
      - 'alerts/webhook/**'
      - 'tools/wifi-router/**'
      - '.github/workflows/container-image-scan.yml'
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  scan:
    name: Trivy scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: falco
            image: 'falcosecurity/falco@sha256:788f1129c542171813083d4afc61b16730a47dde8c23d9c39370acef996349b6'
          - name: osquery
            image: 'osquery/osquery:5.17.0-ubuntu22.04@sha256:47cb6ef2d2724c37c9db89f79387ad1d22051821823280459e439b9ac49d662a'
          - name: openobserve
            image: 'openobserve/openobserve@sha256:d4a878fac1f6c56003764f7f2a1625668917388f167e222c8c810de3f54c56ba'
          - name: dcgm-exporter
            image: 'nvcr.io/nvidia/k8s/dcgm-exporter:latest'
          # Drift monitor for the pinned 0.161.0 deployment (issue #115):
          # scanning the frozen digest cannot show when upstream rebuilds with
          # fixed Go/x-net, so this entry floats while compose keeps the pin.
          - name: otel-collector-contrib
            image: 'otel/opentelemetry-collector-contrib:latest'
          # Drift monitor, not the deployment ref: compose runs these images at
          # their pinned digests (guarded by tests/test_container_security_scan.py).
          # Scanning the floating tags here keeps the weekly CI able to detect an
          # upstream rebuild clearing pcre2 CVE-2026-103111 (#111) — pinning the
          # matrix to the frozen digest would mute that re-pin signal.
          - name: clamav
            image: 'clamav/clamav:latest'
          - name: clamav-base
            image: 'clamav/clamav:latest_base'
          - name: rsigma
            image: 'ghcr.io/timescale/rsigma:0.19.0'
          - name: goflow2
            image: 'netsampler/goflow2:latest'
          - name: grype
            image: 'anchore/grype:latest'
          # The compose `scanner` service actually runs :debug, not :latest —
          # scan the digest that is really deployed (pinned in docker-compose.yaml).
          - name: grype-debug
            image: 'anchore/grype:debug@sha256:1d10432f8ca74c12197a2e5aee75149ac0d2d9a0a26cd08c4018843a8145492f'
          # Self-built image: compiled from source in CI below, then scanned
          # like any other. Trivy's gobinary scanner reads the Go stdlib and
          # module info embedded in the webhook binary.
          - name: webhook
            image: 'localobserve-webhook:latest'
            build: './alerts/webhook'
          # Self-built image: stdlib-only Python shipper for router web-UI
          # syslog (tools/wifi-router). Trivy scans the pinned alpine base +
          # the python runtime packages.
          - name: wifi-router-shipper
            image: 'localobserve-wifi-router:latest'
            build: './tools/wifi-router'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build local image
        if: matrix.build
        run: docker build -t '${{ matrix.image }}' '${{ matrix.build }}'

      # NOTE: trivy-action@v0.36.0 has no install-only mode — every invocation
      # runs a scan. The shared binary is installed by the first call (pin the
      # version here) and reused by later calls via skip-setup-trivy.
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: image
          image-ref: ${{ matrix.image }}
          format: table
          output: trivy-results-${{ matrix.name }}.txt
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          scanners: vuln

      - name: Run Trivy SARIF scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-results-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          limit-severities-for-sarif: true
          scanners: vuln

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-${{ matrix.name }}.sarif
          category: ${{ matrix.name }}
        continue-on-error: true

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-${{ matrix.name }}
          path: |
            trivy-results-${{ matrix.name }}.txt
            trivy-results-${{ matrix.name }}.sarif

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Container scan: ${{ matrix.name }}"
            echo ""
            echo '**Image:** `${{ matrix.image }}`'
            echo '**Severity:** HIGH, CRITICAL (unfixed findings ignored)'
            echo ''
            echo '```'
            cat "trivy-results-${{ matrix.name }}.txt" 2>/dev/null || echo '(scan failed)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: trivy-${{ matrix.name }}
          path: trivy-results-${{ matrix.name }}.txt
        continue-on-error: true

      - name: Check for CRITICAL findings
        run: |
          if grep -q '│ CRITICAL ' "trivy-results-${{ matrix.name }}.txt"; then
            echo 'CRITICAL vulnerabilities detected — failing build'
            exit 1
          fi
          echo 'No CRITICAL vulnerabilities detected'
