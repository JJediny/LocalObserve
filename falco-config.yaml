# Falco configuration for local sidekick forwarding

rules_files:
  - /etc/falco/rules.d/persistence_techniques.yaml
  - /etc/falco/falco_rules.yaml
  - /etc/falco/falco_rules.local.yaml
  - /etc/falco/rules.d
  # Regenerated by tools/sync_threat_intel.py into .data/threat-intel and
  # bind-mounted at /var/lib/threat-intel inside this container.
  - /var/lib/threat-intel/falco_rules.threat_intel.local.yaml

engine:
  # modern_ebpf requires kernel >= 5.8 with BTF (CONFIG_DEBUG_INFO_BTF=y).
  # Falls back gracefully; if the probe fails to attach, switch to kmod
  # which uses a pre-built kernel module bundled with the falco image.
  # On hosts without BTF support (older kernels or WSL), use:
  #   kind: kmod
  kind: modern_ebpf

priority: warning
buffered_outputs: true
json_output: true
log_stderr: true
log_syslog: false

file_output:
  enabled: true
  filename: /var/log/falco/events.jsonl

stdout_output:
  enabled: true

# HTTP output to falcosidekick (disabled by default — uncomment if falcosidekick is deployed):
# http_output:
#   enabled: true
#   url: http://falcosidekick:2801
#
# Without falcosidekick, Falco events are collected by the OTEL collector
# which tails /var/log/falco/events.jsonl and ships them to OpenObserve.

syslog_output:
  enabled: false

metrics:
  enabled: true
  interval: 1h
  output_rule: true
  rules_counters_enabled: true
  resource_utilization_enabled: true
  state_counters_enabled: true
  kernel_event_counters_enabled: true
  libbpf_stats_enabled: true
  convert_memory_to_mb: true
  include_empty_values: false
  kernel_event_counters_per_cpu_enabled: false
