{
  "options": {
    "logger_path": "/home/john/loki/.data/osquery",
    "disable_logging": false,
    "schedule_splay_percent": 25,
    "worker_threads": 4
  },
  "schedule": {
    "// ===== SYSTEM INFORMATION ===== ": {},
    "system_info": {
      "query": "SELECT * FROM system_info;",
      "interval": 3600,
      "description": "System information"
    },
    "os_version": {
      "query": "SELECT * FROM os_version;",
      "interval": 3600,
      "description": "OS version details"
    },
    "kernel_info": {
      "query": "SELECT * FROM kernel_info;",
      "interval": 3600,
      "description": "Kernel information"
    },
    "uptime": {
      "query": "SELECT * FROM uptime;",
      "interval": 600,
      "description": "System uptime"
    },

    "// ===== PERSISTENCE MECHANISMS ===== ": {},
    "crontab": {
      "query": "SELECT * FROM crontab;",
      "interval": 900,
      "description": "Scheduled cron jobs - detect persistence via cron",
      "value": "Identify malware using cron for persistence"
    },
    "crontab_changes": {
      "query": "SELECT * FROM crontab WHERE datetime(strftime('%Y-%m-%d', 'now')) = datetime(strftime('%Y-%m-%d', FROM_UNIXTIME(mtime)));",
      "interval": 300,
      "description": "Recently modified cron jobs",
      "value": "Detect new cron persistence attempts"
    },
    "systemd_units": {
      "query": "SELECT * FROM systemd_units;",
      "interval": 900,
      "description": "Systemd service units - detect service-based persistence",
      "value": "Identify malware creating rogue systemd services"
    },
    "startup_items": {
      "query": "SELECT * FROM startup_items;",
      "interval": 1800,
      "description": "System startup items",
      "value": "Detect boot-time persistence mechanisms"
    },
    "shell_history": {
      "query": "SELECT * FROM users JOIN shell_history USING (uid);",
      "interval": 1800,
      "description": "Shell command history per user",
      "value": "Identify attacker commands and lateral movement with full history visibility during deep forensic review"
    },

    "// ===== PRIVILEGE ESCALATION ===== ": {},
    "suid_bin": {
      "query": "SELECT * FROM suid_bin;",
      "interval": 1800,
      "description": "SUID binaries - privilege escalation vectors",
      "value": "Detect dropped/modified SUID binaries used for privesc"
    },
    "sudo_users": {
      "query": "SELECT * FROM sudoers;",
      "interval": 1800,
      "description": "Sudoers configuration",
      "value": "Detect unauthorized sudo access grants"
    },
    "kernel_modules": {
      "query": "SELECT * FROM kernel_modules;",
      "interval": 900,
      "description": "Loaded kernel modules - kernel-level rootkit detection",
      "value": "Identify kernel rootkits and LPE exploits"
    },
    "kernel_keys": {
      "query": "SELECT * FROM kernel_keys;",
      "interval": 1800,
      "description": "Kernel keyring",
      "value": "Detect kernel key manipulation"
    },

    "// ===== LINUX KEV EXPLOIT INDICATORS ===== ": {},
    "kev_namespace_tooling": {
      "query": "SELECT pid, parent, name, path, cmdline, uid, gid FROM processes WHERE (name = 'unshare' AND (cmdline LIKE '%--user%' OR cmdline LIKE '%--map-root-user%' OR cmdline LIKE '%--mount%')) OR name IN ('newuidmap', 'newgidmap', 'nsenter', 'fuse-overlayfs', 'setcap', 'capsh', 'modprobe', 'insmod', 'rmmod') LIMIT 100;",
      "interval": 300,
      "description": "Namespace, overlayfs, and privilege-helper tooling often seen in Linux KEV exploit chains",
      "value": "Detect user-namespace, overlayfs, and kernel-module exploit helpers"
    },
    "kev_sensitive_mounts": {
      "query": "SELECT * FROM mounts WHERE type IN ('overlay', 'fuse.overlayfs', 'debugfs', 'tracefs', 'securityfs', 'bpf') OR path IN ('/sys/kernel/debug', '/sys/fs/bpf') LIMIT 100;",
      "interval": 900,
      "description": "Overlayfs and kernel-debug related mounts that may support exploit staging",
      "value": "Detect suspicious overlayfs, debugfs, tracefs, or BPF mount usage"
    },
    "kev_sensitive_kernel_file_access": {
      "query": "SELECT DISTINCT pid, path FROM process_open_files WHERE path IN ('/etc/ld.so.preload', '/proc/sys/kernel/core_pattern', '/proc/sys/kernel/modprobe', '/proc/kallsyms', '/proc/kcore') OR path LIKE '/etc/modprobe.d/%' LIMIT 100;",
      "interval": 300,
      "description": "Processes touching kernel and loader control files frequently abused by Linux privilege escalation exploits",
      "value": "Detect access to core_pattern, modprobe, ld.so.preload, kallsyms, and related files"
    },

    "// ===== ROOTKIT/MALWARE DETECTION ===== ": {},
    "file_suspicious_artifacts": {
      "query": "SELECT * FROM file WHERE path IN ('/tmp/.X11-unix/.pizda', '/tmp/.bugtraq', '/tmp/.cinik', '/usr/lib/locale/uboot', '/dev/chr', '/dev/cuc', '/usr/bin/kr4p', '/lib/.x', '/lib/sk', '/etc/bin/ava', '/dev/.kork', '/bin/.login', '/usr/sbin/initdl', '/dev/ptyxx', '/dev/wd4', '/usr/sbin/xsf', '/usr/bin/xchk', '/dev/.lib', '/usr/lib/libsh', '/sbin/xc', '/dev/tux', '/lib/libselinux.so.1.x', '/reptile/reptile_cmd');",
      "interval": 600,
      "description": "Rootkit and malware artifact detection",
      "value": "Detect known rootkits: Knark, SUCKIT, Adore, Reptile, Beurk, etc."
    },
    "hidden_processes": {
      "query": "SELECT * FROM processes WHERE pid NOT IN (SELECT pid FROM process_open_files) AND (name LIKE '%.%' OR name LIKE '%//%');",
      "interval": 600,
      "description": "Potentially hidden processes",
      "value": "Detect process hiding techniques"
    },
    "suspicious_library_paths": {
      "query": "SELECT DISTINCT path FROM process_open_files WHERE path LIKE '/lib/%' AND path LIKE '%.so%' AND (path LIKE '%/././%' OR path LIKE '%/..%' OR path LIKE '%~%');",
      "interval": 900,
      "description": "Suspicious library loading paths",
      "value": "Detect library injection and preloading attacks"
    },

    "// ===== NETWORK EXPLOITATION ===== ": {},
    "listening_ports": {
      "query": "SELECT * FROM listening_ports;",
      "interval": 600,
      "description": "Listening network ports - backdoor detection",
      "value": "Identify rogue listening ports/backdoors"
    },
    "process_open_sockets": {
      "query": "SELECT DISTINCT pid, family, protocol, local_address, local_port, remote_address, remote_port, path FROM process_open_sockets WHERE path <> '' OR remote_address <> '';",
      "interval": 900,
      "description": "Open sockets per process",
      "value": "Detect malware C2 communications with fuller network context during deep forensic review"
    },
    "arp_cache": {
      "query": "SELECT * FROM arp_cache;",
      "interval": 1800,
      "description": "ARP cache - MITM detection",
      "value": "Detect ARP spoofing and man-in-the-middle attacks"
    },
    "iptables": {
      "query": "SELECT * FROM iptables;",
      "interval": 900,
      "description": "iptables firewall rules",
      "value": "Detect firewall misconfigurations and backdoors"
    },
    "routes": {
      "query": "SELECT * FROM routes;",
      "interval": 1800,
      "description": "System routing table",
      "value": "Detect route hijacking and redirection attacks"
    },
    "dns_resolvers": {
      "query": "SELECT * FROM dns_resolvers;",
      "interval": 1800,
      "description": "DNS resolver configuration",
      "value": "Detect DNS poisoning and hijacking"
    },

    "// ===== FILE SYSTEM EXPLOITS ===== ": {},
    "etc_hosts": {
      "query": "SELECT * FROM etc_hosts;",
      "interval": 900,
      "description": "/etc/hosts file - detect host file poisoning",
      "value": "Identify DNS/host-level redirection attacks"
    },
    "process_open_files": {
      "query": "SELECT DISTINCT pid, path FROM process_open_files WHERE path NOT LIKE '/private/var/folders%' AND path NOT LIKE '/System/Library/%' AND path NOT LIKE '/dev/null' AND path NOT LIKE '/dev/urandom' AND path NOT LIKE '/dev/random' AND (path LIKE '/etc/%' OR path LIKE '/tmp/%' OR path LIKE '/root/%' OR path LIKE '/home/%');",
      "interval": 1800,
      "description": "Sensitive files accessed by processes",
      "value": "Detect unauthorized access to sensitive files with broader file-level visibility"
    },
    "file_changes": {
      "query": "SELECT * FROM file WHERE path IN ('/etc/passwd', '/etc/shadow', '/etc/sudoers', '/etc/ssh/sshd_config', '/root/.ssh/authorized_keys', '/boot/grub/grub.cfg', '/boot/grub2/grub.cfg');",
      "interval": 300,
      "description": "Critical file integrity monitoring",
      "value": "Detect modifications to critical system files"
    },
    "suid_bin_changes": {
      "query": "SELECT * FROM suid_bin WHERE ROWID NOT IN (SELECT ROWID FROM suid_bin ORDER BY ROWID DESC LIMIT 100);",
      "interval": 600,
      "description": "New SUID binaries added",
      "value": "Detect dropped SUID binaries for privilege escalation"
    },

    "// ===== PROCESS & MEMORY EXPLOITATION ===== ": {},
    "processes": {
      "query": "SELECT * FROM processes;",
      "interval": 600,
      "description": "Running processes snapshot",
      "value": "Baseline for anomaly detection with full process context during deep forensic review"
    },
    "process_envs": {
      "query": "SELECT * FROM process_envs;",
      "interval": 1800,
      "description": "Process environment variables",
      "value": "Detect process injection and preload attacks with full environment visibility"
    },
    "process_memory_map": {
      "query": "SELECT * FROM process_memory_map;",
      "interval": 1800,
      "description": "Process memory mapping",
      "value": "Detect code injection and shellcode execution with full mapping visibility"
    },
    "process_open_pipes": {
      "query": "SELECT * FROM process_open_pipes;",
      "interval": 1800,
      "description": "Open named pipes per process",
      "value": "Detect inter-process communication and command injection with complete pipe visibility"
    },

    "// ===== USER & AUTHENTICATION ===== ": {},
    "users": {
      "query": "SELECT * FROM users;",
      "interval": 1800,
      "description": "System users",
      "value": "Detect creation of backdoor accounts"
    },
    "groups": {
      "query": "SELECT * FROM groups;",
      "interval": 1800,
      "description": "System groups",
      "value": "Detect group membership modifications"
    },
    "logged_in_users": {
      "query": "SELECT liu.*, p.name, p.cmdline, p.cwd, p.root FROM logged_in_users liu, processes p WHERE liu.pid = p.pid;",
      "interval": 600,
      "description": "Currently logged in users with process details",
      "value": "Detect unauthorized user sessions and lateral movement with full session visibility"
    },
    "last_logins": {
      "query": "SELECT * FROM last LIMIT 100;",
      "interval": 1800,
      "description": "Last user logins",
      "value": "Detect unauthorized access and lateral movement"
    },
    "user_ssh_keys": {
      "query": "SELECT * FROM user_ssh_keys;",
      "interval": 1800,
      "description": "SSH keys per user",
      "value": "Detect unauthorized SSH key addition for persistence"
    },
    "authorized_keys": {
      "query": "SELECT * FROM authorized_keys;",
      "interval": 900,
      "description": "SSH authorized_keys files",
      "value": "Detect SSH backdoors and persistence mechanisms"
    },

    "// ===== KERNEL & HARDWARE SECURITY ===== ": {},
    "secureboot": {
      "query": "SELECT * FROM secureboot;",
      "interval": 3600,
      "description": "Secure Boot status",
      "value": "Verify firmware security"
    },
    "secureboot_certificates": {
      "query": "SELECT * FROM secureboot_certificates;",
      "interval": 3600,
      "description": "Secure Boot certificates",
      "value": "Detect unauthorized firmware modifications"
    },
    "selinux_settings": {
      "query": "SELECT * FROM selinux_settings;",
      "interval": 1800,
      "description": "SELinux policy status",
      "value": "Verify mandatory access control is enforced"
    },
    "apparmor_profiles": {
      "query": "SELECT * FROM apparmor_profiles;",
      "interval": 1800,
      "description": "AppArmor profile status",
      "value": "Verify application sandboxing"
    },

    "// ===== PACKAGE MANAGEMENT ===== ": {},
    "deb_packages": {
      "query": "SELECT * FROM deb_packages;",
      "interval": 3600,
      "description": "Installed Debian packages",
      "value": "Detect installed malware packages with full package inventory visibility"
    },
    "rpm_packages": {
      "query": "SELECT * FROM rpm_packages;",
      "interval": 3600,
      "description": "Installed RPM packages",
      "value": "Detect installed malware packages"
    },

    "// ===== SUSPICIOUS ACTIVITY ===== ": {},
    "apt_sources": {
      "query": "SELECT * FROM apt_sources;",
      "interval": 3600,
      "description": "APT package sources configuration",
      "value": "Detect compromised/malicious package repositories"
    },
    "device_file": {
      "query": "SELECT * FROM device_file;",
      "interval": 1800,
      "description": "Device file information",
      "value": "Detect device-based rootkits and persistence"
    },
    "disk_encryption": {
      "query": "SELECT * FROM disk_encryption;",
      "interval": 3600,
      "description": "Disk encryption status",
      "value": "Verify data protection mechanisms"
    },
    "mounts": {
      "query": "SELECT * FROM mounts;",
      "interval": 900,
      "description": "Mounted filesystems",
      "value": "Detect unauthorized mounts, NFS shares, and lateral movement vectors"
    },
    "shared_memory": {
      "query": "SELECT * FROM shared_memory;",
      "interval": 1800,
      "description": "Shared memory segments",
      "value": "Detect IPC-based attacks and privilege escalation"
    },

    "// ===== CONTAINER & DOCKER SECURITY ===== ": {},
    "docker_containers": {
      "query": "SELECT * FROM docker_containers;",
      "interval": 600,
      "description": "Running Docker containers",
      "value": "Detect container-based exploits and breakouts with complete container metadata"
    },
    "docker_images": {
      "query": "SELECT * FROM docker_images;",
      "interval": 900,
      "description": "Docker images",
      "value": "Detect malicious container images with full inventory visibility"
    },
    "docker_info": {
      "query": "SELECT * FROM docker_info;",
      "interval": 3600,
      "description": "Docker daemon information",
      "value": "Verify Docker security configuration"
    }
  },
  "decorators": {
    "load": [
      "SELECT uuid AS host_uuid FROM system;",
      "SELECT user AS username FROM logged_in_users ORDER BY time DESC LIMIT 1;",
      "SELECT hostname FROM system_info;",
      "SELECT version FROM os_version;"
    ]
  },
  "packs": {
    "incident_response": "/etc/osquery/packs/incident-response.conf",
    "rootkit_detection": "/etc/osquery/packs/ossec-rootkit.conf",
    "compliance": "/etc/osquery/packs/it-compliance.conf"
  }
}
