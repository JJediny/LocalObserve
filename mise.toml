# mise.toml - Repository-wide development environment configuration
# Automatically sets up tool dependencies and OpenTelemetry instrumentation parameters.
#
# Container runtimes: this provisions the CLIENT/CLI binaries for the three runtimes
# the stack supports (Docker, Podman, Nerdctl) plus the `docker compose` plugin.
# mise installs CLIs only -- the ENGINES/DAEMONS must be provided by the host:
#   * docker-cli    -> provides the `docker`/`dockerd` CLI; needs a running `dockerd`
#                      + socket (Docker Desktop or distro `docker-ce`).
#   * docker-compose-> real github:docker/compose; enables `docker compose`.
#   * nerdctl       -> provides the `nerdctl` CLI; needs a running `containerd` daemon.
#   * podman        -> on Linux mise ships the REMOTE CLIENT as `podman-remote`
#                      (no `podman` shim). Pair it with a podman server/machine, or
#                      install the full engine via the distro (apt/dnf/brew).
#   * task          -> provides the go-task runner used by Taskfile.yml.
#   * uv            -> provides the pinned Python package runner for uv.lock.
# After `mise install`, trust this file once: `mise trust`. To use the mise-managed
# binaries, activate mise in your shell (`mise activate`) or prefix commands with
# `mise x --`; otherwise a system-installed docker/podman on PATH takes precedence.

[tools]
golang = "1.21.13"
docker-cli = "29.7.2"      # provides the `docker` CLI
nerdctl = "2.3.5"        # containerd CLI (compose-compatible)
podman = "6.1.0"         # provides the `podman` CLI (+ `podman compose`)
docker-compose = "5.5.0" # real github:docker/compose; enables `docker compose`
betterleaks = "1.8.1"    # ML-assisted secret scanner (gitleaks-compatible) for `task secret-scan`
osv-scanner = "2.5.1"     # OSV vulnerability scanner for source/dependency scans
task = "3.53.1"           # go-task runner for Taskfile.yml
uv = "0.12.5"             # Python package runner and lockfile manager

[env]
# OpenTelemetry Core Configuration for Python, Golang, and Rust
OTEL_EXPORTER_OTLP_ENDPOINT = "http://localhost:4317"
OTEL_EXPORTER_OTLP_PROTOCOL = "grpc"
OTEL_SERVICE_NAME = "localobserve"
OTEL_TRACES_EXPORTER = "otlp"
OTEL_LOGS_EXPORTER = "otlp"
OTEL_METRICS_EXPORTER = "none"

# Python/Go/Rust auto-instrumentation hints
OTEL_PYTHON_AUTO_INSTRUMENT = "true"

# Mise is the single entry point for local setup and common repository scripts.
# The full operations catalog remains in Taskfile.yml (`mise exec task -- task --list`).
[tasks.setup]
description = "Install pinned CLIs, Python dependencies, and standalone detection binaries"
run = [
  "mise install",
  "uv sync --frozen",
  "task install-tools",
  "task install-rsigma",
]

[tasks.test]
description = "Run the hermetic static test suite"
run = "uv run python -m pytest tests/"

[tasks.upgrade-check]
description = "Report available mise and Python dependency upgrades without changing files"
run = [
  "mise outdated --bump",
  "uv lock --upgrade --dry-run",
]

[tasks.agent-demo]
description = "Emit a synthetic AI agent session through the capture pipeline"
run = "uv run python tools/agent_session_demo.py"

[tasks."agent:zed"]
description = "Watch native Zed agent sessions in the foreground"
run = "uv run python tools/zed_agent_observer.py"

[tasks."agent:zed:start"]
description = "Start deduplicated capture of existing and new Zed agent sessions"
run = "bash scripts/zed-agent-observer.sh start"

[tasks."agent:zed:stop"]
description = "Stop native Zed agent session capture"
run = "bash scripts/zed-agent-observer.sh stop"

[tasks."agent:zed:status"]
description = "Show native Zed agent observer status and log path"
run = "bash scripts/zed-agent-observer.sh status"

[tasks."agent:zed:once"]
description = "Scan and export changed Zed sessions once"
run = "uv run python tools/zed_agent_observer.py --once"
