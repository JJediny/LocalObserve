---
networks:
  loki:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500

services:
  read:
    image: grafana/loki@sha256:73e905b51a7f917f7a1075e4be68759df30226e03dcb3cd2213b989cc0dc8eb4
    command: "-config.file=/etc/loki/config.yaml -target=read"
    expose:
      - "3100"
      - "7946"
      - "9095"
    mem_limit: 512m
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
    depends_on:
      - minio
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      loki:
        aliases:
          - loki

  write:
    image: grafana/loki@sha256:73e905b51a7f917f7a1075e4be68759df30226e03dcb3cd2213b989cc0dc8eb4
    command: "-config.file=/etc/loki/config.yaml -target=write"
    expose:
      - "3100"
      - "7946"
      - "9095"
    mem_limit: 512m
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
    depends_on:
      - minio
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      loki:
        aliases:
          - loki

  backend:
    image: grafana/loki@sha256:73e905b51a7f917f7a1075e4be68759df30226e03dcb3cd2213b989cc0dc8eb4
    command: "-config.file=/etc/loki/config.yaml -target=backend -legacy-read-mode=false"
    expose:
      - "3100"
      - "7946"
      - "9095"
    mem_limit: 512m
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
    depends_on:
      - minio
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - loki

  alloy:
    image: grafana/alloy@sha256:51aeb9d829239345070619dad3edd6873186f913c84f45b365b74574fcb38ec0
    volumes:
      - ./alloy-local-config.yaml:/etc/alloy/config.alloy:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /var/log/syslog:/var/log/syslog:ro
      - ./.data/osquery:/var/log/osquery:ro
      - ./.data/host-import:/var/log/host-import:ro
    environment:
      - GOMEMLIMIT=400MiB
    mem_limit: 512m
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    depends_on:
      - gateway
    networks:
      - loki
    cap_add:
      - DAC_READ_SEARCH

  minio:
    image: minio/minio
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data && \
        mkdir -p /data/loki-ruler && \
        minio server /data --console-address ':9001'
    environment:
      - MINIO_ROOT_USER=loki
      - MINIO_ROOT_PASSWORD=supersecret
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_UPDATE=off
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 20s
      retries: 5
    networks:
      - loki

  grafana:
    image: grafana/grafana@sha256:2d1f9ae67c1778d33e291d4c3c759cd8b650e67491f02533499eb950e075eeb5
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - gateway
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            access: proxy
            url: http://gateway:3100
            isDefault: true
            jsonData:
              httpHeaderName1: "X-Scope-OrgID"
            secureJsonData:
              httpHeaderValue1: "tenant1"
        EOF
        mkdir -p /etc/grafana/provisioning/dashboards
        cat <<EOF > /etc/grafana/provisioning/dashboards/dashboards.yaml
        apiVersion: 1
        providers:
          - name: 'Security Dashboards'
            orgId: 1
            folder: ''
            type: file
            disableDeletion: false
            updateIntervalSeconds: 10
            options:
              path: /var/lib/grafana/dashboards
        EOF
        exec /run.sh
    ports:
      - "3000:3000"
    volumes:
      - ./dashboards/grafana:/var/lib/grafana/dashboards:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loki

  gateway:
    image: nginx:latest
    depends_on:
      - read
      - write
    entrypoint:
      - sh
      - -euc
      - |
        cat <<'EOF' > /etc/nginx/nginx.conf
        user nginx;
        worker_processes auto;

        events {
          worker_connections 1000;
        }

        http {
          access_log /dev/stdout;
          error_log /dev/stderr info;
          resolver 127.0.0.11 valid=10s ipv6=off;
          
          client_max_body_size 100M;
          client_body_buffer_size 100M;

          server {
            listen 3100;

            location = / {
              add_header Content-Type text/plain;
              return 200 'OK';
            }

            location = /ready {
              proxy_pass http://read:3100/ready;
            }

            location = /metrics {
              proxy_pass http://read:3100/metrics;
            }

            location = /api/prom/push {
              proxy_pass http://write:3100;
            }

            location = /api/prom/tail {
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
              proxy_pass http://read:3100;
            }

            location ~ /api/prom/.* {
              proxy_pass http://read:3100;
            }

            location = /loki/api/v1/push {
              proxy_pass http://write:3100;
            }

            location = /loki/api/v1/tail {
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
              proxy_pass http://read:3100;
            }

            location ~ /loki/api/.* {
              proxy_pass http://read:3100;
            }
          }
        }
        EOF
        /docker-entrypoint.sh nginx -g "daemon off;"
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loki

  falcosidekick:
    image: falcosecurity/falcosidekick@sha256:754dd93b831998d5017d5a18eec1b85a93d9e1c56e847b04e4ed3866579fbe85
    environment:
      - LOKI_HOSTPORT=http://gateway:3100
      - LOKI_TENANT=tenant1
      - LOKI_MINIMUMPRIORITY=warning
      - LISTENPORT=2801
    expose:
      - "2801"
    depends_on:
      - gateway
    networks:
      - loki
