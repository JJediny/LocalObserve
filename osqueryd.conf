{
  "options": {
    "logger_path": "/var/log/osquery",
    "disable_logging": false,
    "schedule_splay_percent": 25,
    "worker_threads": 4
  },
  "schedule": {
    "// ===== SYSTEM INFORMATION ===== ": {},
    "system_info": {
      "query": "SELECT * FROM system_info;",
      "interval": 3600,
      "description": "System information"
    },
    "os_version": {
      "query": "SELECT * FROM os_version;",
      "interval": 3600,
      "description": "OS version details"
    },
    "kernel_info": {
      "query": "SELECT * FROM kernel_info;",
      "interval": 3600,
      "description": "Kernel information"
    },
    "uptime": {
      "query": "SELECT * FROM uptime;",
      "interval": 600,
      "description": "System uptime"
    },
    "// ===== HARDWARE & PHYSICAL DEVICES ===== ": {},
    "usb_devices": {
      "query": "SELECT * FROM usb_devices;",
      "interval": 600,
      "description": "Currently connected USB devices for hardware intrusion detection [T1200]"
    },
    "// ===== PERSISTENCE MECHANISMS ===== ": {},
    "crontab": {
      "query": "SELECT * FROM crontab;",
      "interval": 900,
      "description": "Scheduled cron jobs - detect persistence via cron [T1053.003]",
      "value": "Identify malware using cron for persistence"
    },
    "crontab_changes": {
      "query": "SELECT c.path, c.command, f.ctime FROM crontab c JOIN file f ON c.path = f.path WHERE f.ctime > (strftime('%s', 'now') - 86400);",
      "interval": 300,
      "description": "Recently modified cron jobs [T1053.003]",
      "value": "Detect new cron persistence attempts"
    },
    "systemd_units": {
      "query": "SELECT * FROM systemd_units;",
      "interval": 900,
      "description": "Systemd service units - detect service-based persistence [T1543.002]",
      "value": "Identify malware creating rogue systemd services"
    },
    "startup_items": {
      "query": "SELECT * FROM startup_items;",
      "interval": 43200,
      "description": "System startup items [T1547]",
      "value": "Detect boot-time persistence mechanisms"
    },
    "shell_history": {
      "query": "SELECT username, command, time, directory, shell FROM users JOIN shell_history USING (uid) ORDER BY time DESC LIMIT 200;",
      "interval": 21600,
      "description": "Recent shell command history per user",
      "value": "Identify attacker commands and lateral movement without logging full history on every run"
    },
    "// ===== PRIVILEGE ESCALATION ===== ": {},
    "suid_bin": {
      "query": "SELECT * FROM suid_bin WHERE path LIKE '/usr/bin/%' OR path LIKE '/usr/sbin/%' OR path LIKE '/bin/%' OR path LIKE '/sbin/%';",
      "interval": 1800,
      "description": "SUID binaries in system paths [T1548.001]",
      "value": "Detect dropped/modified SUID binaries used for privesc"
    },
    "sudo_users": {
      "query": "SELECT * FROM sudoers;",
      "interval": 1800,
      "description": "Sudoers configuration [T1548.003]",
      "value": "Detect unauthorized sudo access grants"
    },
    "kernel_modules": {
      "query": "SELECT * FROM kernel_modules;",
      "interval": 900,
      "description": "Loaded kernel modules - kernel-level rootkit detection [T1547.006]",
      "value": "Identify kernel rootkits and LPE exploits"
    },
    "kernel_keys": {
      "query": "SELECT * FROM kernel_keys;",
      "interval": 1800,
      "description": "Kernel keyring",
      "value": "Detect kernel key manipulation"
    },
    "// ===== LINUX KEV EXPLOIT INDICATORS ===== ": {},
    "kev_namespace_tooling": {
      "query": "SELECT pid, parent, name, path, cmdline, uid, gid FROM processes WHERE (name = 'unshare' AND (cmdline LIKE '%--user%' OR cmdline LIKE '%--map-root-user%' OR cmdline LIKE '%--mount%')) OR name IN ('newuidmap', 'newgidmap', 'nsenter', 'fuse-overlayfs', 'setcap', 'capsh', 'modprobe', 'insmod', 'rmmod') LIMIT 100;",
      "interval": 300,
      "description": "Namespace, overlayfs, and privilege-helper tooling often seen in Linux KEV exploit chains",
      "value": "Detect user-namespace, overlayfs, and kernel-module exploit helpers"
    },
    "kev_sensitive_mounts": {
      "query": "SELECT * FROM mounts WHERE type IN ('overlay', 'fuse.overlayfs', 'debugfs', 'tracefs', 'securityfs', 'bpf') OR path IN ('/sys/kernel/debug', '/sys/fs/bpf') LIMIT 100;",
      "interval": 900,
      "description": "Overlayfs and kernel-debug related mounts that may support exploit staging",
      "value": "Detect suspicious overlayfs, debugfs, tracefs, or BPF mount usage"
    },
    "kev_sensitive_kernel_file_access": {
      "query": "SELECT DISTINCT pid, path FROM process_open_files WHERE path IN ('/etc/ld.so.preload', '/proc/sys/kernel/core_pattern', '/proc/sys/kernel/modprobe', '/proc/kallsyms', '/proc/kcore') OR path LIKE '/etc/modprobe.d/%' LIMIT 100;",
      "interval": 300,
      "description": "Processes touching kernel and loader control files frequently abused by Linux privilege escalation exploits",
      "value": "Detect access to core_pattern, modprobe, ld.so.preload, kallsyms, and related files"
    },
    "// ===== ROOTKIT/MALWARE DETECTION ===== ": {},
    "file_suspicious_artifacts": {
      "query": "SELECT * FROM file WHERE path IN ('/tmp/.X11-unix/.pizda', '/tmp/.bugtraq', '/tmp/.cinik', '/usr/lib/locale/uboot', '/dev/chr', '/dev/cuc', '/usr/bin/kr4p', '/lib/.x', '/lib/sk', '/etc/bin/ava', '/dev/.kork', '/bin/.login', '/usr/sbin/initdl', '/dev/ptyxx', '/dev/wd4', '/usr/sbin/xsf', '/usr/bin/xchk', '/dev/.lib', '/usr/lib/libsh', '/sbin/xc', '/dev/tux', '/lib/libselinux.so.1.x', '/reptile/reptile_cmd');",
      "interval": 600,
      "description": "Rootkit and malware artifact detection",
      "value": "Detect known rootkits: Knark, SUCKIT, Adore, Reptile, Beurk, etc."
    },
    "hidden_processes": {
      "query": "SELECT * FROM processes WHERE pid NOT IN (SELECT pid FROM process_open_files) AND (name LIKE '%.%' OR name LIKE '%//%') LIMIT 100;",
      "interval": 1800,
      "description": "Potentially hidden processes [T1564.001]",
      "value": "Detect process hiding techniques"
    },
    "suspicious_library_paths": {
      "query": "SELECT DISTINCT path FROM process_open_files WHERE path LIKE '/lib/%' AND path LIKE '%.so%' AND (path LIKE '%/././%' OR path LIKE '%/..%' OR path LIKE '%~%');",
      "interval": 900,
      "description": "Suspicious library loading paths",
      "value": "Detect library injection and preloading attacks"
    },
    "// ===== NETWORK EXPLOITATION ===== ": {},
    "listening_ports": {
      "query": "SELECT * FROM listening_ports;",
      "interval": 600,
      "description": "Listening network ports - backdoor detection [T1071]",
      "value": "Identify rogue listening ports/backdoors"
    },
    "process_open_sockets": {
      "query": "SELECT DISTINCT pid, family, protocol, local_address, local_port, remote_address, remote_port, path FROM process_open_sockets WHERE path <> '' OR remote_address NOT IN ('', '0.0.0.0', '::') LIMIT 200;",
      "interval": 1800,
      "removed": false,
      "description": "Open sockets per process",
      "value": "Detect malware C2 communications"
    },
    "arp_cache": {
      "query": "SELECT * FROM arp_cache;",
      "interval": 1800,
      "description": "ARP cache - MITM detection",
      "value": "Detect ARP spoofing and man-in-the-middle attacks"
    },
    "iptables": {
      "query": "SELECT * FROM iptables;",
      "interval": 900,
      "description": "iptables firewall rules",
      "value": "Detect firewall misconfigurations and backdoors"
    },
    "routes": {
      "query": "SELECT * FROM routes;",
      "interval": 1800,
      "description": "System routing table",
      "value": "Detect route hijacking and redirection attacks"
    },
    "dns_resolvers": {
      "query": "SELECT * FROM dns_resolvers;",
      "interval": 1800,
      "description": "DNS resolver configuration",
      "value": "Detect DNS poisoning and hijacking"
    },
    "// ===== FILE SYSTEM EXPLOITS ===== ": {},
    "etc_hosts": {
      "query": "SELECT * FROM etc_hosts;",
      "interval": 900,
      "description": "/etc/hosts file - detect host file poisoning",
      "value": "Identify DNS/host-level redirection attacks"
    },
    "process_open_files": {
      "query": "SELECT DISTINCT pid, path FROM process_open_files WHERE path NOT LIKE '/private/var/folders%' AND path NOT LIKE '/System/Library/%' AND path NOT LIKE '/dev/null' AND path NOT LIKE '/dev/urandom' AND path NOT LIKE '/dev/random' AND (path LIKE '/etc/%' OR path LIKE '/tmp/%' OR path LIKE '/root/%' OR path LIKE '/home/%') LIMIT 200;",
      "interval": 3600,
      "description": "Sensitive files accessed by processes",
      "value": "Detect unauthorized access to sensitive files"
    },
    "file_changes": {
      "query": "SELECT * FROM file WHERE path IN ('/etc/passwd', '/etc/shadow', '/etc/sudoers', '/etc/ssh/sshd_config', '/root/.ssh/authorized_keys', '/boot/grub/grub.cfg', '/boot/grub2/grub.cfg');",
      "interval": 300,
      "description": "Critical file integrity monitoring [T1565.001]",
      "value": "Detect modifications to critical system files"
    },
    "suid_bin_changes": {
      "query": "SELECT s.path, s.username, s.groupname, s.permissions, f.ctime FROM suid_bin s JOIN file f ON s.path = f.path WHERE (s.path LIKE '/usr/bin/%' OR s.path LIKE '/usr/sbin/%' OR s.path LIKE '/bin/%' OR s.path LIKE '/sbin/%') AND f.ctime > (strftime('%s', 'now') - 86400);",
      "interval": 600,
      "description": "New SUID binaries added in system paths",
      "value": "Detect dropped SUID binaries for privilege escalation"
    },
    "// ===== PROCESS & MEMORY EXPLOITATION ===== ": {},
    "processes": {
      "query": "SELECT pid, name, path, cmdline, parent, uid, gid, state FROM processes ORDER BY pid LIMIT 500;",
      "interval": 1800,
      "removed": false,
      "description": "Running processes snapshot",
      "value": "Baseline for anomaly detection with a lower-volume process view"
    },
    "ownerless_processes": {
      "query": "SELECT p.pid, p.name, p.path, p.cmdline, p.uid, p.gid FROM processes p LEFT JOIN users u ON p.uid = u.uid WHERE u.uid IS NULL LIMIT 100;",
      "interval": 300,
      "description": "Processes running under UIDs that do not exist in /etc/passwd [T1036]",
      "value": "Detect container escape, local privilege escalation, or user account cleanup evasion"
    },
    "process_envs": {
      "query": "SELECT pid, key, value FROM process_envs WHERE key IN ('LD_PRELOAD', 'LD_LIBRARY_PATH', 'DYLD_INSERT_LIBRARIES', 'PYTHONPATH', 'NODE_OPTIONS', 'PROMPT_COMMAND') LIMIT 200;",
      "interval": 3600,
      "description": "Suspicious process environment variables",
      "value": "Detect process injection and preload attacks without logging full desktop session environments"
    },
    "process_open_pipes": {
      "query": "SELECT pid, fd, mode, inode, type FROM process_open_pipes LIMIT 100;",
      "interval": 3600,
      "description": "Suspicious open named pipes per process",
      "value": "Detect inter-process communication and command injection with less baseline noise"
    },
    "// ===== USER & AUTHENTICATION ===== ": {},
    "users": {
      "query": "SELECT * FROM users;",
      "interval": 86400,
      "description": "System users [T1136.001]",
      "value": "Detect creation of backdoor accounts"
    },
    "groups": {
      "query": "SELECT * FROM groups;",
      "interval": 1800,
      "description": "System groups",
      "value": "Detect group membership modifications"
    },
    "logged_in_users": {
      "query": "SELECT liu.*, p.name, p.cmdline, p.cwd, p.root FROM logged_in_users liu, processes p WHERE liu.pid = p.pid LIMIT 50;",
      "interval": 1800,
      "description": "Currently logged in users with process details",
      "value": "Detect unauthorized user sessions and lateral movement"
    },
    "last_logins": {
      "query": "SELECT * FROM last LIMIT 100;",
      "interval": 1800,
      "description": "Last user logins",
      "value": "Detect unauthorized access and lateral movement"
    },
    "user_ssh_keys": {
      "query": "SELECT * FROM users JOIN user_ssh_keys USING (uid);",
      "interval": 1800,
      "description": "SSH keys per user",
      "value": "Detect unauthorized SSH key addition for persistence"
    },
    "authorized_keys": {
      "query": "SELECT * FROM users JOIN authorized_keys USING (uid);",
      "interval": 900,
      "description": "SSH authorized_keys files [T1098.004]",
      "value": "Detect SSH backdoors and persistence mechanisms"
    },
    "// ===== KERNEL & HARDWARE SECURITY ===== ": {},
    "secureboot": {
      "query": "SELECT * FROM secureboot;",
      "interval": 3600,
      "description": "Secure Boot status",
      "value": "Verify firmware security"
    },
    "secureboot_certificates": {
      "query": "SELECT * FROM secureboot_certificates;",
      "interval": 3600,
      "description": "Secure Boot certificates",
      "value": "Detect unauthorized firmware modifications"
    },
    "selinux_settings": {
      "query": "SELECT * FROM selinux_settings;",
      "interval": 1800,
      "description": "SELinux policy status",
      "value": "Verify mandatory access control is enforced"
    },
    "apparmor_profiles": {
      "query": "SELECT * FROM apparmor_profiles;",
      "interval": 1800,
      "description": "AppArmor profile status",
      "value": "Verify application sandboxing"
    },
    "// ===== PACKAGE MANAGEMENT ===== ": {},
    "deb_packages": {
      "query": "SELECT COUNT(*) AS count FROM deb_packages;",
      "interval": 86400,
      "description": "Installed Debian package count",
      "value": "Track broad package inventory changes without logging every installed package on each run"
    },
    "rpm_packages": {
      "query": "SELECT * FROM rpm_packages;",
      "interval": 86400,
      "description": "Installed RPM packages",
      "value": "Detect installed malware packages"
    },
    "// ===== SUSPICIOUS ACTIVITY ===== ": {},
    "apt_sources": {
      "query": "SELECT * FROM apt_sources;",
      "interval": 3600,
      "description": "APT package sources configuration",
      "value": "Detect compromised/malicious package repositories"
    },
    "device_file": {
      "query": "SELECT * FROM file WHERE path LIKE '/dev/%';",
      "interval": 1800,
      "description": "Device file information",
      "value": "Detect device-based rootkits and persistence"
    },
    "disk_encryption": {
      "query": "SELECT * FROM disk_encryption;",
      "interval": 3600,
      "description": "Disk encryption status",
      "value": "Verify data protection mechanisms"
    },
    "mounts": {
      "query": "SELECT * FROM mounts;",
      "interval": 3600,
      "description": "Mounted filesystems",
      "value": "Detect unauthorized mounts, NFS shares, and lateral movement vectors"
    },
    "shared_memory": {
      "query": "SELECT * FROM shared_memory;",
      "interval": 1800,
      "description": "Shared memory segments",
      "value": "Detect IPC-based attacks and privilege escalation"
    },
    "// ===== CONTAINER & DOCKER SECURITY ===== ": {},
    "docker_containers": {
      "query": "SELECT id, name, image, image_id, status FROM docker_containers ORDER BY name LIMIT 100;",
      "interval": 1800,
      "description": "Running Docker containers [T1610]",
      "value": "Detect container-based exploits and breakouts"
    },
    "docker_images": {
      "query": "SELECT id, tags, size_bytes, created FROM docker_images ORDER BY created DESC LIMIT 200;",
      "interval": 86400,
      "description": "Docker images",
      "value": "Detect malicious container images without frequent full inventory churn"
    },
    "docker_info": {
      "query": "SELECT * FROM docker_info;",
      "interval": 3600,
      "description": "Docker daemon information",
      "value": "Verify Docker security configuration"
    },
    "file_events": {
      "query": "SELECT * FROM file_events;",
      "interval": 300,
      "description": "FIM events for profile and init scripts [T1546.004] [T1037.004] [T1070.003]",
      "removed": false
    }
  },
  "decorators": {
    "load": [
      "SELECT uuid AS host_uuid FROM system;",
      "SELECT user AS username FROM logged_in_users ORDER BY time DESC LIMIT 1;",
      "SELECT hostname FROM system_info;",
      "SELECT version FROM os_version;"
    ]
  },
  "packs": {
    "rootkit_detection": "/etc/osquery/packs/ossec-rootkit.conf"
  },
  "file_paths": {
    "bash_profiles": [
      "/home/%/.bashrc",
      "/home/%/.bash_profile",
      "/home/%/.bash_history",
      "/root/.bashrc",
      "/root/.bash_profile",
      "/root/.bash_history",
      "/etc/profile",
      "/etc/bash.bashrc",
      "/etc/profile.d/%%"
    ],
    "init_scripts": [
      "/etc/rc.local",
      "/etc/init.d/%%"
    ],
    "systemd_configs": [
      "/etc/systemd/system/%%",
      "/lib/systemd/system/%%"
    ],
    "ssh_keys": [
      "/home/%/.ssh/%%",
      "/root/.ssh/%%"
    ],
    "motd_scripts": [
      "/etc/update-motd.d/%%",
      "/etc/motd"
    ],
    "udev_rules": [
      "/etc/udev/rules.d/%",
      "/lib/udev/rules.d/%"
    ],
    "threat_intel": [
      "/var/lib/threat-intel/tor_ips.txt",
      "/var/lib/threat-intel/bad_user_agents.txt",
      "/var/lib/threat-intel/named_pipes.txt",
      "/var/lib/threat-intel/ransomware_extensions.txt"
    ]
  }
}