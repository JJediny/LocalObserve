---
networks:
  localobserve:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500

services:
  falco:
    image: falcosecurity/falco@sha256:b4166a61f41e2fa638c041cac881d8bb32c284e3aaf282fdfed80f15f6eb55e3
    privileged: true
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/host/var/run/docker.sock
      - /dev:/host/dev
      - /proc:/host/proc:ro
      - ./falco-config.yaml:/etc/falco/config.d/zz-local.yaml:ro
      - ./falco_rules.local.yaml:/etc/falco/falco_rules.local.yaml:ro
      - ./.data/falco:/var/log/falco:z
      - /etc:/host/etc:ro
    pid: host
    network_mode: host
    environment:
      - FALCO_K8S_AUDIT_ENDPOINT=
      - FALCO_HOSTNAME=localhost
    healthcheck:
      test: ["CMD", "falco", "--list", "rules"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 30s

  osquery:
    image: osquery/osquery:latest
    privileged: true
    mem_limit: 256m
    memswap_limit: 256m
    pid: host
    network_mode: host
    restart: unless-stopped
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./osquery.flags:/etc/osquery/osquery.flags:ro
      - ./osqueryd.conf:/etc/osquery/osquery.conf:ro
      - ./.data/osquery:/var/log/osquery:z
    command: [
      "osqueryd",
      "--flagfile=/etc/osquery/osquery.flags",
      "--config_path=/etc/osquery/osquery.conf",
      "--logger_path=/var/log/osquery",
      "--database_path=/var/log/osquery/osquery.db"
    ]

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve@sha256:0c057ffda5a29cbf945023e4710bf38f192e61f807201a7c6611f9a8761c1756
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL:-root@example.com}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD:-Complexpass#123}
      - ZO_DATA_DIR=/data
      - ZO_FEATURE_PER_THREAD_LOCK=true
      - RUST_LOG=error
      - O2_AI_ENABLED=true
      - O2_TOOL_API_URL=http://openobserve:5080
      - ZO_RETENTION_PERIOD=180
    ports:
      - "5080:5080"
      - "5081:5081"
    volumes:
      - ./.data/openobserve:/data:z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - localobserve
    healthcheck:
      test: ["CMD", "/openobserve", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:latest
    runtime: nvidia
    profiles:
      - gpu
    mem_limit: 256m
    memswap_limit: 256m
    cap_add:
      - SYS_ADMIN
    ports:
      - "9400:9400"
    networks:
      - localobserve

  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:f41d7995565df3733b7568702073a9c490792f9c6ac60684fe6a4da21a313f8d
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    # Hard ceiling = 2x the memory_limiter soft limit (256m) so the limiter
    # can trigger graceful back-pressure before the OOM killer fires.
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL:-root@example.com}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD:-Complexpass#123}
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./.data/osquery:/var/log/osquery:ro,z
      - ./.data/falco:/var/log/falco:ro,z
      - ./.data/clamav:/var/log/clamav:ro,z
      - ./.data/goflow2:/var/log/goflow2:ro,z
      - /var/log:/host/var/log:ro
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
      - /:/hostfs:ro
    pid: host
    user: "0:0"
    restart: unless-stopped
    depends_on:
      - openobserve
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - localobserve
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    profiles:
      - scan
    # ClamAV loads the full virus DB (~1.5GiB) into shared memory.
    # A hard limit here would cause startup failure; we set a generous
    # ceiling and rely on the DB's MaxFileSize/MaxScanSize caps for I/O safety.
    mem_limit: 2g
    memswap_limit: 2g
    volumes:
      - clamav_db:/var/lib/clamav
      - clamav_sockets:/tmp
      - /:/hostfs:ro
    environment:
      - CLAMAV_NO_CLAMD=false
      - CLAMAV_NO_FRESHCLAMD=false
    networks:
      - localobserve

  clamav-scanner:
    image: clamav/clamav:latest_base
    restart: unless-stopped
    profiles:
      - scan
    # Disable inherited server health check (this container only runs clamdscan client)
    healthcheck:
      disable: true
    # Scanner client is lightweight; DB is in shared memory owned by clamav daemon.
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - clamav_db:/var/lib/clamav:ro
      - clamav_sockets:/tmp
      - /:/hostfs:ro
      - ./.data/clamav:/var/log/clamav:z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "LocalSocket /tmp/clamd.sock" > /tmp/clamd.conf
        while true; do
          # Wait for clamd to be ready
          while ! clamdscan -c /tmp/clamd.conf --ping 10 2>/dev/null && ! echo PING | nc -w 1 -U /tmp/clamd.sock; do sleep 10; done
          # Clean scan.log before starting a new scan
          echo "Starting full filesystem scan..." > /var/log/clamav/scan.log
          # Perform traversal with robust exclusions pruned at find-level for maximum speed and safety
          find /hostfs \
            \( -path "/hostfs/sys" -o \
               -path "/hostfs/proc" -o \
               -path "/hostfs/dev" -o \
               -path "/hostfs/run" -o \
               -path "/hostfs/tmp" -o \
               -path "/hostfs/var/log" -o \
               -path "/hostfs/var/lib/docker" -o \
               -path "/hostfs/var/lib/containerd" \) -prune \
            -o -type f -print0 2>/dev/null | xargs -0 clamdscan -c /tmp/clamd.conf --multiscan --fdpass \
            --log=/var/log/clamav/scan.log 2>&1 | grep -vE 'Not supported file type|cli_realpath|LibClamAV Warning' || true
          sleep 86400
        done
    networks:
      - localobserve
    depends_on:
      - clamav

  alert-receiver:
    build:
      context: ./alerts/webhook
      dockerfile: Dockerfile
    image: localobserve-webhook:latest
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    ports:
      - "9000:9000"
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-unix:path=/run/user/1000/bus}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/1000}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - EMAIL_TO=${EMAIL_TO:-}
      - GENERIC_WEBHOOK_URL=${GENERIC_WEBHOOK_URL:-}
    volumes:
      - /run/user/1000:/run/user/1000
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /etc/machine-id:/var/lib/dbus/machine-id:ro
      - /etc/machine-id:/etc/machine-id:ro
      - ./.data/alerts:/var/log/alerts:z
    networks:
      - localobserve
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  rsigma:
    image: ghcr.io/timescale/rsigma:0.19.0
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    working_dir: /app
    volumes:
      - ./rules/sigma:/app/rules/sigma:ro
    ports:
      - "9090:9090"
    command: ["engine", "daemon", "--config", "/app/rules/sigma/rsigma.yaml", "--allow-plaintext"]
    networks:
      - localobserve
    healthcheck:
      test: ["CMD", "rsigma", "engine", "status", "--addr", "127.0.0.1:9090"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  goflow2:
    image: netsampler/goflow2:latest
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "2055:2055/udp"
      - "6343:6343/udp"
    volumes:
      - ./.data/goflow2:/var/log/goflow2:z
    command: ["-transport=file", "-transport.file=/var/log/goflow2/flows.jsonl"]
    networks:
      - localobserve

volumes:
  clamav_db:
  clamav_sockets:
