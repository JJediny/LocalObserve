---
networks:
  loki:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500

services:
  falco:
    image: falcosecurity/falco@sha256:b4166a61f41e2fa638c041cac881d8bb32c284e3aaf282fdfed80f15f6eb55e3
    privileged: true
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/host/var/run/docker.sock
      - /dev:/host/dev
      - /proc:/host/proc:ro
      - ./falco-config.yaml:/etc/falco/config.d/zz-local.yaml:ro
      - ./falco_rules.local.yaml:/etc/falco/falco_rules.local.yaml:ro
      - ./.data/falco:/var/log/falco
    environment:
      - FALCO_K8S_AUDIT_ENDPOINT=
      - FALCO_HOSTNAME=localhost
    networks:
      - loki

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve@sha256:0c057ffda5a29cbf945023e4710bf38f192e61f807201a7c6611f9a8761c1756
    environment:
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL:-root@example.com}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD:-Complexpass#123}
      - ZO_DATA_DIR=/data
      - ZO_FEATURE_PER_THREAD_LOCK=true
      - RUST_LOG=error
    ports:
      - "5080:5080"
      - "5081:5081"
    volumes:
      - ./.data/openobserve:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - loki

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:latest
    runtime: nvidia
    cap_add:
      - SYS_ADMIN
    ports:
      - "9400:9400"
    networks:
      - loki

  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:f41d7995565df3733b7568702073a9c490792f9c6ac60684fe6a4da21a313f8d
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL:-root@example.com}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD:-Complexpass#123}
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./.data/osquery:/var/log/osquery:ro
      - ./.data/falco:/var/log/falco:ro
      - /var/log:/host/var/log:ro
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
      - /:/hostfs:ro
    pid: host
    user: "0:0"
    depends_on:
      - openobserve
      - dcgm-exporter
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - loki
