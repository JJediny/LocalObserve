- list: known_ptrace_binaries
  items:
    - chrome_crashpad
    - chrome_crashpad_handler
  override:
    items: append

- macro: user_read_sensitive_file_conditions
  condition: >
    or (
      proc.name in (systemd-executor, cinnamon-screensaver-pam-helper, osqueryd, SchedulerRunner)
      and (fd.name=/etc/shadow or fd.directory=/etc/pam.d or fd.directory=/etc/sudoers.d or fd.name=/etc/sudoers)
    )
  override:
    condition: append

- list: kev_kernel_sensitive_read_paths
  items:
    - /proc/kallsyms
    - /proc/kcore
    - /etc/ld.so.preload
    - /proc/sys/kernel/core_pattern
    - /proc/sys/kernel/modprobe

- list: kev_kernel_sensitive_write_paths
  items:
    - /etc/ld.so.preload
    - /proc/sys/kernel/core_pattern
    - /proc/sys/kernel/modprobe

- macro: kev_namespace_or_overlay_activity
  condition: >
    (
      (proc.name=unshare and (proc.args contains "--user" or proc.args contains "--map-root-user" or proc.args contains "--mount"))
      or proc.name in (newuidmap, newgidmap, nsenter, fuse-overlayfs)
      or (proc.name in (mount, fusermount, fusermount3) and proc.args contains "overlay")
    )

- rule: Unprivileged namespace or overlayfs exploit tooling
  desc: Detect common user-namespace and overlayfs helpers frequently seen in Linux local privilege escalation and container-escape proof-of-concepts.
  condition: >
    spawned_process
    and proc_name_exists
    and user.uid != 0
    and kev_namespace_or_overlay_activity
  output: Potential namespace or overlayfs exploit tooling launched | user=%user.name user_uid=%user.uid process=%proc.name proc_exepath=%proc.exepath parent=%proc.pname command=%proc.cmdline terminal=%proc.tty
  priority: WARNING
  tags:
    [
      maturity_incubating,
      host,
      container,
      process,
      linux,
      kev,
      mitre_privilege_escalation,
      T1068,
    ]

- rule: Suspicious read of kernel exploit-sensitive files
  desc: Detect reads of kernel or loader control files commonly referenced by Linux local privilege escalation exploits and post-exploitation staging.
  condition: >
    open_read
    and proc_name_exists
    and user.uid != 0
    and (
      fd.name in (kev_kernel_sensitive_read_paths)
      or fd.name startswith "/etc/modprobe.d/"
    )
  output: Suspicious read of kernel exploit-sensitive file | file=%fd.name user=%user.name user_uid=%user.uid process=%proc.name proc_exepath=%proc.exepath parent=%proc.pname command=%proc.cmdline terminal=%proc.tty
  priority: WARNING
  tags:
    [
      maturity_incubating,
      host,
      container,
      filesystem,
      linux,
      kev,
      mitre_privilege_escalation,
      T1068,
    ]

- rule: Suspicious write of kernel exploit-sensitive files
  desc: Detect writes to kernel or loader control files that are commonly abused during Linux privilege escalation and persistence chains.
  condition: >
    open_write
    and proc_name_exists
    and user.uid != 0
    and (
      fd.name in (kev_kernel_sensitive_write_paths)
      or fd.name startswith "/etc/modprobe.d/"
    )
  output: Suspicious write of kernel exploit-sensitive file | file=%fd.name user=%user.name user_uid=%user.uid process=%proc.name proc_exepath=%proc.exepath parent=%proc.pname command=%proc.cmdline terminal=%proc.tty
  priority: WARNING
  tags:
    [
      maturity_incubating,
      host,
      container,
      filesystem,
      linux,
      kev,
      mitre_privilege_escalation,
      T1068,
    ]
# Allow-list for binaries that legitimately run inside containers but trigger
# upstream 'Drop and execute new binary in container' (EXE_UPPER_LAYER detections).
- macro: user_known_container_binaries
  condition: >
    (
      proc.name in (dcgm-exporter, otelcol-contrib)
      or container.name in (loki-dcgm-exporter-1, loki-otel-collector-1)
    )

# Fix schema: 'tags' is not a valid key inside an 'override' sub-object.
# Tags listed here replace the upstream rule tags (acceptable — we own these overrides).
- rule: Drop and execute new binary in container
  override:
    condition: append
  condition: and not user_known_container_binaries
  tags: [mitre_execution, T1059]

- rule: Clear Log Activities
  override:
    condition: append
  condition: and not proc.name in (truncate, logrotate, rm)
  tags: [mitre_defense_evasion, T1070]

# Suppress false-positive: nvidia-ctk runs ldconfig via memfd_create as part of
# the NVIDIA container toolkit hook — this is normal and expected GPU startup behavior.
- rule: Fileless execution via memfd_create
  override:
    condition: append
  condition: >
    and not (
      proc.exepath startswith "memfd:"
      and (proc.exepath contains "nvidia-ctk-hook" or proc.exepath contains "ldconfig")
    )

- rule: SSH Outbound from Service Account
  desc: Detect SSH or SCP executed by non-administrative service accounts (lateral movement).
  condition: >
    spawned_process
    and (proc.name = ssh or proc.name = scp)
    and user.name in (www-data, postgres, mysql, daemon, nobody)
  output: Outbound SSH connection from service account | user=%user.name command=%proc.cmdline
  priority: WARNING
  tags: [mitre_lateral_movement, T1021.004]

- rule: Hijack Execution Flow with LD_PRELOAD
  desc: Detect LD_PRELOAD in process environment for dynamic linker hijacking.
  condition: >
    spawned_process
    and proc.env contains "LD_PRELOAD="
  output: Process executed with LD_PRELOAD environment variable | user=%user.name command=%proc.cmdline env=%proc.env
  priority: WARNING
  tags: [mitre_privilege_escalation, mitre_defense_evasion, T1574.006]

- rule: Clear Command History (Truncate)
  desc: Detect clearing of .bash_history via truncation.
  condition: >
    open_write
    and fd.name contains ".bash_history"
    and evt.arg.flags contains "O_TRUNC"
  output: Truncation of bash history file | user=%user.name file=%fd.name command=%proc.cmdline
  priority: WARNING
  tags: [mitre_defense_evasion, T1070.003]

- rule: Masquerading as Kernel Thread
  desc: Detect processes running from user space that disguise as kernel threads like kworker.
  condition: >
    spawned_process
    and (proc.name startswith "kworker/" or proc.name startswith "rcu_")
    and (proc.exepath startswith "/tmp/" or proc.exepath startswith "/dev/shm/" or proc.exepath startswith "/var/tmp/")
  output: Masquerading as kernel thread | user=%user.name command=%proc.cmdline exepath=%proc.exepath
  priority: WARNING
  tags: [mitre_defense_evasion, T1036.003]
