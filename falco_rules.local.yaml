- list: known_ptrace_binaries
  items:
    - chrome_crashpad
    - chrome_crashpad_handler
  override:
    items: append

- macro: user_read_sensitive_file_conditions
  condition: >
    or (
      proc.name in (systemd-executor, cinnamon-screensaver-pam-helper, osqueryd, SchedulerRunner)
      and (fd.name=/etc/shadow or fd.directory=/etc/pam.d or fd.directory=/etc/sudoers.d or fd.name=/etc/sudoers)
    )
  override:
    condition: append

- list: kev_kernel_sensitive_read_paths
  items:
    - /proc/kallsyms
    - /proc/kcore
    - /etc/ld.so.preload
    - /proc/sys/kernel/core_pattern
    - /proc/sys/kernel/modprobe

- list: kev_kernel_sensitive_write_paths
  items:
    - /etc/ld.so.preload
    - /proc/sys/kernel/core_pattern
    - /proc/sys/kernel/modprobe

- macro: kev_namespace_or_overlay_activity
  condition: >
    (
      (proc.name=unshare and (proc.args contains "--user" or proc.args contains "--map-root-user" or proc.args contains "--mount"))
      or proc.name in (newuidmap, newgidmap, nsenter, fuse-overlayfs)
      or (proc.name in (mount, fusermount, fusermount3) and proc.args contains "overlay")
    )

- rule: Unprivileged namespace or overlayfs exploit tooling
  desc: Detect common user-namespace and overlayfs helpers frequently seen in Linux local privilege escalation and container-escape proof-of-concepts.
  condition: >
    spawned_process
    and proc_name_exists
    and user.uid != 0
    and kev_namespace_or_overlay_activity
  output: Potential namespace or overlayfs exploit tooling launched | user=%user.name user_uid=%user.uid process=%proc.name proc_exepath=%proc.exepath parent=%proc.pname command=%proc.cmdline terminal=%proc.tty
  priority: WARNING
  tags:
    [
      maturity_incubating,
      host,
      container,
      process,
      linux,
      kev,
      mitre_privilege_escalation,
      T1068,
    ]

- rule: Suspicious read of kernel exploit-sensitive files
  desc: Detect reads of kernel or loader control files commonly referenced by Linux local privilege escalation exploits and post-exploitation staging.
  condition: >
    open_read
    and proc_name_exists
    and user.uid != 0
    and (
      fd.name in (kev_kernel_sensitive_read_paths)
      or fd.name startswith "/etc/modprobe.d/"
    )
  output: Suspicious read of kernel exploit-sensitive file | file=%fd.name user=%user.name user_uid=%user.uid process=%proc.name proc_exepath=%proc.exepath parent=%proc.pname command=%proc.cmdline terminal=%proc.tty
  priority: WARNING
  tags:
    [
      maturity_incubating,
      host,
      container,
      filesystem,
      linux,
      kev,
      mitre_privilege_escalation,
      T1068,
    ]

- rule: Suspicious write of kernel exploit-sensitive files
  desc: Detect writes to kernel or loader control files that are commonly abused during Linux privilege escalation and persistence chains.
  condition: >
    open_write
    and proc_name_exists
    and user.uid != 0
    and (
      fd.name in (kev_kernel_sensitive_write_paths)
      or fd.name startswith "/etc/modprobe.d/"
    )
  output: Suspicious write of kernel exploit-sensitive file | file=%fd.name user=%user.name user_uid=%user.uid process=%proc.name proc_exepath=%proc.exepath parent=%proc.pname command=%proc.cmdline terminal=%proc.tty
  priority: WARNING
  tags:
    [
      maturity_incubating,
      host,
      container,
      filesystem,
      linux,
      kev,
      mitre_privilege_escalation,
      T1068,
    ]
# Allow-list for binaries that legitimately run inside containers but trigger
# upstream 'Drop and execute new binary in container' (EXE_UPPER_LAYER detections).
- macro: user_known_container_binaries
  condition: >
    (
      proc.name in (dcgm-exporter, otelcol-contrib)
      or container.name in (loki-dcgm-exporter-1, loki-otel-collector-1)
    )

# Override upstream conditions only; Falco does not allow tag overrides here.
- rule: Drop and execute new binary in container
  override:
    condition: append
  condition: and not user_known_container_binaries
  tags: [mitre_execution, T1204]

- rule: Clear Log Activities
  override:
    condition: append
  condition: and not proc.name in (truncate, logrotate, rm)
  tags: [mitre_defense_evasion, T1070.003]

# Suppress false-positive: nvidia-ctk runs ldconfig via memfd_create as part of
# the NVIDIA container toolkit hook — this is normal and expected GPU startup behavior.
- rule: Fileless execution via memfd_create
  override:
    condition: append
  condition: >
    and not (
      proc.exepath startswith "memfd:"
      and (proc.exepath contains "nvidia-ctk-hook" or proc.exepath contains "ldconfig")
    )

- rule: SSH Outbound from Service Account
  desc: Detect SSH or SCP executed by non-administrative service accounts (lateral movement).
  condition: >
    spawned_process
    and (proc.name = ssh or proc.name = scp)
    and user.name in (www-data, postgres, mysql, daemon, nobody)
  output: Outbound SSH connection from service account | user=%user.name command=%proc.cmdline
  priority: WARNING
  tags: [mitre_lateral_movement, T1021.004]

- rule: Hijack Execution Flow with LD_PRELOAD
  desc: Detect LD_PRELOAD in process environment for dynamic linker hijacking.
  condition: >
    spawned_process
    and proc.env contains "LD_PRELOAD="
  output: Process executed with LD_PRELOAD environment variable | user=%user.name command=%proc.cmdline env=%proc.env
  priority: WARNING
  tags: [mitre_privilege_escalation, mitre_defense_evasion, T1574.006]

- rule: Clear Command History (Truncate)
  desc: Detect clearing of .bash_history via truncation.
  condition: >
    open_write
    and fd.name contains ".bash_history"
    and evt.arg.flags contains "O_TRUNC"
  output: Truncation of bash history file | user=%user.name file=%fd.name command=%proc.cmdline
  priority: WARNING
  tags: [mitre_defense_evasion, T1070.003]

- rule: Masquerading as Kernel Thread
  desc: Detect processes running from user space that disguise as kernel threads like kworker.
  condition: >
    spawned_process
    and (proc.name startswith "kworker/" or proc.name startswith "rcu_")
    and (proc.exepath startswith "/tmp/" or proc.exepath startswith "/dev/shm/" or proc.exepath startswith "/var/tmp/")
  output: Masquerading as kernel thread | user=%user.name command=%proc.cmdline exepath=%proc.exepath
  priority: WARNING
  tags: [mitre_defense_evasion, T1036.003]

- rule: Reverse Shell Detection
  desc: Detect reverse shells by identifying shell binaries with outbound network connections.
  condition: >
    spawned_process
    and proc.name in (bash, sh, dash, zsh, fish, ksh, csh, tcsh)
    and fd.type in (ipv4, ipv6)
    and fd.lip != 127.0.0.1
    and fd.sip != 127.0.0.1
  output: Reverse shell detected | user=%user.name process=%proc.name parent=%proc.pname command=%proc.cmdline connection=%fd.name
  priority: CRITICAL
  tags: [mitre_execution, mitre_lateral_movement, T1059.004]

- rule: Web Server Spawned Shell
  desc: Detect shell execution spawned by web server processes (web shell indicator).
  condition: >
    spawned_process
    and proc.name in (bash, sh, dash, zsh, fish, ksh, csh, tcsh, python, python3, perl, ruby, php)
    and proc.aname in (apache2, httpd, nginx, lighttpd, node, php-fpm, tomcat, java, gunicorn, uwsgi)
    and not (proc.pname=node and proc.cmdline="sh -c ldd --version 2>&1 || true")
  output: Web server spawned shell | user=%user.name process=%proc.name parent=%proc.pname command=%proc.cmdline
  priority: CRITICAL
  tags: [mitre_execution, T1059.004]

- rule: Shadow File Read by Non-Auth Process
  desc: Detect reading of /etc/shadow by processes other than known authentication daemons.
  condition: >
    open_read
    and fd.name=/etc/shadow
    and not proc.name in (sshd, sudo, su, passwd, chsh, chfn, login, suexec, polkit-agent-helper-1, polkit-agent-he, gdm-password, sddm-helper, lightdm, nscd, winbind, rpc.mountd, dpkg-preconfigu)
    and not proc.exepath=/usr/lib/polkit-1/polkit-agent-helper-1
  output: Unauthorized /etc/shadow read | user=%user.name user_uid=%user.uid process=%proc.name proc_exepath=%proc.exepath parent=%proc.pname command=%proc.cmdline
  priority: CRITICAL
  tags: [mitre_credential_access, T1003.008]

- rule: Cross-User Bash History Access
  desc: Detect reading of another user's bash history file (credential harvesting).
  condition: >
    open_read
    and fd.name contains ".bash_history"
    and user.uid != 0
    and not fd.directory startswith /home/%user.name
    and not fd.directory startswith /root
  output: Cross-user bash history access | user=%user.name user_uid=%user.uid file=%fd.name process=%proc.name command=%proc.cmdline
  priority: WARNING
  tags: [mitre_credential_access, T1552.003]

- rule: Security Tool Tampering
  desc: Detect attempts to stop, disable, or tamper with security monitoring tools.
  condition: >
    spawned_process
    and (
      (proc.name in (systemctl, service) and proc.args contains "falco")
      or (proc.name in (systemctl, service) and proc.args contains "osquery")
      or (proc.name in (systemctl, service) and proc.args contains "auditd")
      or (proc.name = iptables and proc.args contains "-F")
      or (proc.name = iptables and proc.args contains "-X")
      or (proc.name = setenforce)
      or (proc.name in (aa-teardown, aa-disable, aa-remove-profile))
      or (proc.name = sysctl and proc.args contains "kernel.yama.ptrace_scope")
      or (proc.name = kill and (proc.args contains "falco" or proc.args contains "osqueryd" or proc.args contains "otelcol"))
      or (proc.name = pkill and (proc.args contains "falco" or proc.args contains "osqueryd" or proc.args contains "otelcol"))
    )
  output: Security tool tampering detected | user=%user.name user_uid=%user.uid process=%proc.name command=%proc.cmdline
  priority: CRITICAL
  tags: [mitre_defense_evasion, T1562.001]

- rule: Execution from Temporary Directory
  desc: Detect binary execution from /tmp, /dev/shm, or /var/tmp (common malware staging).
  condition: >
    spawned_process
    and (proc.exepath startswith "/tmp/" or proc.exepath startswith "/dev/shm/" or proc.exepath startswith "/var/tmp/" or proc.exepath startswith "/run/user/")
    and not proc.exepath startswith "/tmp/.X11-unix/"
  output: Execution from temporary directory | user=%user.name user_uid=%user.uid process=%proc.name proc_exepath=%proc.exepath parent=%proc.pname command=%proc.cmdline
  priority: WARNING
  tags: [mitre_execution, T1059.004, mitre_defense_evasion, T1036.005]

- rule: Suspicious File Permission Changes
  desc: Detect chmod operations that set SUID/SGID bits or world-writable permissions on sensitive paths.
  condition: >
    spawned_process
    and proc.name = chmod
    and (
      (proc.args contains "u+s" or proc.args contains "g+s" or proc.args contains "4" or proc.args contains "2")
      or proc.args contains "777"
      or proc.args contains "o+w"
    )
    and (
      proc.args contains "/usr/"
      or proc.args contains "/bin/"
      or proc.args contains "/sbin/"
      or proc.args contains "/etc/"
      or proc.args contains "/var/"
    )
  output: Suspicious permission change on system path | user=%user.name user_uid=%user.uid command=%proc.cmdline
  priority: WARNING
  tags: [mitre_privilege_escalation, T1548.001]

- rule: Credential Dumping Tool Execution
  desc: Detect execution of known credential dumping tools on Linux.
  condition: >
    spawned_process
    and proc.name in (mimipenguin, laZagne, lazagne, linpeas, linenum, pspy, chisel, ligolo-ng)
  output: Credential dumping or recon tool executed | user=%user.name user_uid=%user.uid process=%proc.name proc_exepath=%proc.exepath command=%proc.cmdline
  priority: CRITICAL
  tags: [mitre_credential_access, T1003.007, mitre_discovery, T1087]

- rule: Outbound Data Transfer via Common Tools
  desc: Detect large data exfiltration attempts using curl, wget, or scp to external IPs.
  condition: >
    spawned_process
    and proc.name in (curl, wget, scp, sftp, rsync, nc, ncat, netcat, socat)
    and (proc.args contains "http://" or proc.args contains "https://" or proc.args contains "ftp://" or proc.args contains "sftp://")
    and not proc.args contains "localhost"
    and not proc.args contains "127.0.0.1"
    and user.uid != 0
  output: Potential data exfiltration via common tool | user=%user.name user_uid=%user.uid process=%proc.name command=%proc.cmdline
  priority: WARNING
  tags: [mitre_exfiltration, T1048, T1041]

- rule: DNS Query to Suspicious Resolver
  desc: Detect modification of DNS resolver configuration (DNS hijacking).
  condition: >
    open_write
    and fd.name=/etc/resolv.conf
    and not proc.name in (dhclient, dhcpcd, NetworkManager, systemd-resolved, netplan, wpa_supplicant)
  output: DNS resolver configuration modified | user=%user.name user_uid=%user.uid process=%proc.name command=%proc.cmdline file=%fd.name
  priority: WARNING
  tags: [mitre_defense_evasion, T1562.002]

- rule: Kernel Module Manipulation
  desc: Detect loading or unloading of kernel modules by non-root or unexpected processes.
  condition: >
    spawned_process
    and proc.name in (insmod, rmmod, modprobe)
    and user.uid != 0
  output: Non-root kernel module manipulation | user=%user.name user_uid=%user.uid process=%proc.name command=%proc.cmdline
  priority: CRITICAL
  tags: [mitre_privilege_escalation, T1547.006]

- rule: Cron or At Job Creation by Non-Admin
  desc: Detect creation of new cron jobs or at jobs by non-root users for persistence.
  condition: >
    spawned_process
    and (proc.name = crontab or proc.name = at)
    and user.uid != 0
    and (proc.args contains "-e" or proc.args contains "-l" or proc.args startswith "-")
  output: Non-admin cron/at job modification | user=%user.name user_uid=%user.uid process=%proc.name command=%proc.cmdline
  priority: WARNING
  tags: [mitre_persistence, T1053.003]

- rule: Package Repository Tampering
  desc: Detect modification of APT sources or keys (supply chain attack vector).
  condition: >
    open_write
    and (fd.name startswith "/etc/apt/sources" or fd.name startswith "/etc/apt/keyrings/" or fd.name startswith "/etc/apt/trusted.gpg")
    and not proc.name in (apt, apt-get, apt-key, add-apt-repository, dpkg)
  output: APT repository or key tampering | user=%user.name user_uid=%user.uid process=%proc.name command=%proc.cmdline file=%fd.name
  priority: CRITICAL
  tags: [mitre_persistence, T1195.001]

- rule: Sysctl Kernel Parameter Modification
  desc: Detect modification of kernel parameters that could disable security features.
  condition: >
    spawned_process
    and proc.name = sysctl
    and user.uid != 0
    and (
      proc.args contains "kernel.modules_disabled"
      or proc.args contains "kernel.kptr_restrict"
      or proc.args contains "kernel.dmesg_restrict"
      or proc.args contains "kernel.perf_event_paranoid"
      or proc.args contains "net.ipv4.ip_forward"
      or proc.args contains "net.ipv4.conf.all.accept_redirects"
    )
  output: Suspicious kernel parameter modification | user=%user.name user_uid=%user.uid command=%proc.cmdline
  priority: WARNING
  tags: [mitre_defense_evasion, T1562.001]

- rule: Unexpected Outbound Network Connection
  desc: Detects non-network processes making outbound connections on commonly abused C2 ports
  condition: >
    outbound
    and not proc.name in (curl, wget, ssh, nc, ncat, nmap, falco, falcosidekick)
    and fd.dport in (4444, 4445, 8080, 8443, 1337)
  output: Unexpected outbound connection (proc=%proc.name pid=%proc.pid dport=%fd.dport dip=%fd.sip)
  priority: WARNING
  tags: [mitre_command_and_control, T1071, network]

- rule: Suspicious Outbound SSH Connection
  desc: Detect outbound SSH or SCP executions originating from unexpected daemon or service accounts (T1021.004).
  condition: >
    spawned_process
    and proc.name in (ssh, scp)
    and (user.name in (www-data, postgres, mysql, redis, mongodb, daemon) or proc.pname in (apache, nginx, www-data, postgres, mysql, redis, mongod))
  output: Suspicious outbound SSH/SCP connection initiated by daemon/service account | user=%user.name process=%proc.name command=%proc.cmdline parent=%proc.pname
  priority: CRITICAL
  tags: [mitre_lateral_movement, T1021.004]

- rule: Reverse Shell Spawning
  desc: Detect spawning of an interactive shell connected to a network socket (T1059.004).
  condition: >
    spawned_process
    and proc.name in (bash, sh, dash, zsh, ksh)
    and (proc.pname in (nc, ncat, netcat, python, perl, ruby, php, node, java) or fd.connected = true)
  output: Interactive reverse shell spawned | user=%user.name process=%proc.name parent=%proc.pname command=%proc.cmdline
  priority: CRITICAL
  tags: [mitre_execution, T1059.004]

- rule: User Profile Bashrc Modification
  desc: Detect write operations to user-level profile scripts by unexpected processes (T1546.004).
  condition: >
    open_write
    and (fd.name endswith "/.bashrc" or fd.name endswith "/.bash_profile" or fd.name endswith "/.profile" or fd.name endswith "/.bash_login" or fd.name endswith "/.bash_logout")
    and not proc.name in (bash, sh, dpkg, apt, apt-get, setup)
  output: User bashrc or profile shell script modified by unexpected process | file=%fd.name process=%proc.name user=%user.name command=%proc.cmdline
  priority: WARNING
  tags: [mitre_persistence, T1546.004]

- rule: Dynamic Linker Hijacking via LD_PRELOAD
  desc: Detect executions where the environment contains the LD_PRELOAD variable, often used by user-land rootkits (T1574.006).
  condition: >
    spawned_process
    and proc.env contains "LD_PRELOAD="
    and not proc.name in (sudo, systemd)
  output: Process executed with dynamic linker hijack env (LD_PRELOAD) | user=%user.name process=%proc.name command=%proc.cmdline
  priority: WARNING
  tags: [mitre_privilege_escalation, T1574.006]

- rule: Truncate Command History
  desc: Detect write/truncation of bash history files to hide system commands (T1070.003).
  condition: >
    open_write
    and fd.name endswith "/.bash_history"
    and fd.size = 0
  output: User command history file (.bash_history) truncated | file=%fd.name process=%proc.name user=%user.name command=%proc.cmdline
  priority: WARNING
  tags: [mitre_defense_evasion, T1070.003]

- rule: System Utility Masquerading
  desc: Detect execution of processes masquerading as kernel threads but running from user-space paths (T1036.003).
  condition: >
    spawned_process
    and (proc.name startswith "kworker/" or proc.name = "rcu_sched" or proc.name startswith "ksoftirqd/")
    and not proc.exepath startswith "/kernel/"
    and not proc.exepath = ""
  output: Masquerading process running as fake kernel thread | user=%user.name process=%proc.name exepath=%proc.exepath command=%proc.cmdline
  priority: CRITICAL
  tags: [mitre_defense_evasion, T1036.003]

- rule: Unauthorized Access to User Bash History
  desc: Detect reading other users' bash history files (T1552.003).
  condition: >
    open_read
    and fd.name endswith "/.bash_history"
    and user.uid != fd.uid
    and user.uid != 0
  output: Unauthorized read access to another user's bash history file | file=%fd.name reader_user=%user.name file_owner_uid=%fd.uid process=%proc.name command=%proc.cmdline
  priority: WARNING
  tags: [mitre_credential_access, T1552.003]

- rule: Suspicious Read of etc shadow
  desc: Detect unauthorized read operations on the local password shadow file (T1003.008).
  condition: >
    open_read
    and fd.name = "/etc/shadow"
    and not proc.name in (sshd, sudo, su, passwd, gdm, login, systemd-executor, cinnamon-screensaver-pam-helper, osqueryd, SchedulerRunner)
  output: Unauthorized read access to local credential store (/etc/shadow) | reader_user=%user.name process=%proc.name command=%proc.cmdline
  priority: CRITICAL
  tags: [mitre_credential_access, T1003.008]
